title: "Place\nStirrups"
tooltip: >-
  Places the full stirrup cage across the beam's three distribution zones
  (rev 2 section 3: dense at both supports, normal at midspan), one
  `SetLayoutAsMaximumSpacing` rebar set per zone.

  Closure types 1, 2 and 4 only -- type 3 (nested double perimeter) is
  parked because its inner loop has no defined dimension in the spec
  (rev 2 section 9 item 3, A31); selecting it REFUSES.

  Requires a RebarHookType from the Stirrup/Tie family (REBAR_HOOK_STYLE
  == 1) at 135 degrees (rev 2 section 7.3, A45) -- the picker filters to
  that family, and a model with no such hook REFUSES naming the fix
  rather than falling back to the first hook found. A stock library
  normally satisfies this already, since its Stirrup/Tie hooks ship at 90
  and 135 degrees; what it does NOT ship is a Stirrup/Tie hook at 180
  degrees, which is why A45 moved the required angle to 135. Note that a
  hook's NAME does not determine its family -- a hook called
  "Stirrup/Tie - 45" was found on a live model with REBAR_HOOK_STYLE == 0
  (Standard), which is exactly what the family guard catches.

  REFUSES if a collinear beam is detected at either end (continuous run,
  rev 2 section 9 item 2) or if no support is detected at either end.
  See specs/beam-rft-detailing.md S5 and GitHub issue #18.
author: Essam Kader
