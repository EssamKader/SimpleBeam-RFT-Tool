title: UI Spike
author: Essam Kader
tooltip: |
  THROWAWAY spike for issue #42. Proves the UI hosting only -- it places
  nothing, validates nothing and opens no transaction.

  Checks, by running rather than by reading source: a WPFWindow loading a
  XAML file by bare filename from this folder; a TabControl under pyRevit's
  injected theme resources (no precedent in pyRevit's 187 shipped XAML
  files); a Canvas drawn from rft.core numbers at a computed scale; whether
  a relative bitmap path resolves, from code and declared in XAML; and
  redraw cost per keystroke, reported in milliseconds.

  Delete this panel once #42 is closed.
