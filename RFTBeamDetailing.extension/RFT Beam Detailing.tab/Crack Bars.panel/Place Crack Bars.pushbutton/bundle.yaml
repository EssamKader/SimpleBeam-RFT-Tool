title: "Place Crack\nBars"
tooltip: >-
  Crack/skin reinforcement for deep beams (rev 2 section 5) -- fires ONLY
  when the beam's own depth h > 700 mm; a shallower beam reports "not
  triggered" and places nothing (not an error).

  Places one bar per side face per layer, running the full span, embedded
  straight into the support with NO hook (A23) -- unlike the main bars,
  section 2's anchorage/bend machinery is never applied to these bars.
  Exempt from the section 6.2 spacing validation (A25).

  Needs a crack-bar RebarBarType plus the top, bottom and stirrup
  RebarBarType selections (their diameters feed the layer-offset formula
  that locates the innermost main bar layer, A26) -- none of the three is
  placed by this pushbutton.

  REFUSES if a collinear beam is detected at either end (continuous run,
  rev 2 section 9 item 2). See specs/beam-rft-detailing.md S6 and GitHub
  issue #19.
author: Essam Kader
